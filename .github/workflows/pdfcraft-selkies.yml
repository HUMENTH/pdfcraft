name: Build PDFCraft Selkies (ARM64)

on:
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "Also update the :latest convenience tag"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - pdfcraft-selkies
    paths:
      - ".github/workflows/pdfcraft-selkies.yml"
      - ".dockerignore"
      - "Dockerfile.selKies"
      - "selkies/**"
      - "packaging/linux/**"
      - "packaging/env.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "craft-i18n.rev"
      - "ATTRIBUTION.toml"

permissions:
  contents: read

concurrency:
  group: pdfcraft-selkies-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83
  NFPM_VERSION: 2.47.0
  NFPM_SHA256: 1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c

jobs:
  build-and-publish:
    name: Build PDFCraft .deb and Selkies image (ARM64)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout this fork and branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl jq git cmake clang \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libgtk-3-dev libvulkan-dev \
            libegl-dev libxkbcommon-x11-dev libxcursor-dev \
            libxinerama-dev libxfixes-dev libxrender-dev \
            qpdf poppler-utils
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install nfpm (pinned ARM64 binary and checksum)
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_arm64.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum --check -
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Install Rust 1.95 toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.95.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version
          "$HOME/.cargo/bin/cargo" --version

      - name: Cache Cargo build output
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Check out pinned craft-fonts input
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false

      - name: Read and validate craft-i18n pin
        id: i18n-pin
        shell: bash
        run: |
          set -euo pipefail
          test -f craft-i18n.rev
          REV="$(tr -d '[:space:]' < craft-i18n.rev)"
          [[ "$REV" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::craft-i18n.rev must contain one full 40-character commit SHA"
            exit 1
          }
          echo "rev=$REV" >> "$GITHUB_OUTPUT"

      - name: Check out craft-i18n at repository pin
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-i18n
          ref: ${{ steps.i18n-pin.outputs.rev }}
          path: craft-i18n
          persist-credentials: false

      - name: Configure required embedded build inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >> "$GITHUB_ENV"
          echo "CRAFT_FONTS_REQUIRED=1" >> "$GITHUB_ENV"
          echo "CRAFT_I18N_DIR=$GITHUB_WORKSPACE/craft-i18n" >> "$GITHUB_ENV"
          echo "CRAFT_I18N_REQUIRED=1" >> "$GITHUB_ENV"
          echo "PDFCRAFT_BUILD_LABEL=selkies" >> "$GITHUB_ENV"
          echo "PDFCRAFT_BUILD_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "PDFCRAFT_BUILD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Verify locked workspace and required build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s Cargo.lock
          cargo metadata --locked --format-version 1 >/dev/null
          test -f "$CRAFT_FONTS_DIR/fonts/manifest.txt"
          test -f "$CRAFT_FONTS_DIR/fonts/simplified-chinese-manifest.txt"
          find "$CRAFT_I18N_DIR/locales" -name pdfcraft.tsv -print -quit | grep -q .
          echo "PDFCraft version: $(cargo xtask version)"
          echo "PDFCraft commit: $GITHUB_SHA"

      - name: Build and package native ARM64 desktop app
        shell: bash
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          CRAFT_I18N_DIR: ${{ github.workspace }}/craft-i18n
          CRAFT_I18N_REQUIRED: "1"
          PDFCRAFT_BUILD_LABEL: selkies
          PDFCRAFT_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The upstream packager builds pdfcraft + pdfcraft-cli and stages/checks
          # OCR models, model licences and attribution from ATTRIBUTION.toml.
          packaging/linux/package.sh --formats "deb"

          DEB="$(find dist/release -maxdepth 1 -type f \
            -name 'pdfcraft-*-selkies-linux-aarch64.deb' -print -quit)"
          test -n "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" \
            | grep -E '/usr/bin/pdfcraft$|/usr/share/pdfcraft/models/'
          mkdir -p dist/selkies
          cp "$DEB" dist/selkies/

      - name: Resolve immutable image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cargo xtask version | tr -d '[:space:]')"
          SHORT_SHA="${GITHUB_SHA::12}"
          OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/$OWNER/pdfcraft-selkies"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION-selkies-$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.selKies
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.title=PDFCraft Selkies
            org.opencontainers.image.description=PDFCraft desktop streamed with LinuxServer Selkies
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}-selkies

      - name: Update :latest convenience tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_latest
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          IMMUTABLE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "$IMAGE:$IMMUTABLE_TAG"

      - name: Verify published image is ARM64
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$TAG"
          docker buildx imagetools inspect "$IMAGE:$TAG" --raw | jq -e '
            ((.architecture == "arm64" and .os == "linux") or
             ([.manifests[]? | select(
               .platform.os == "linux" and .platform.architecture == "arm64"
             )] | length > 0))
          '

      - name: Upload Debian package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-selkies-deb-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}
          path: dist/selkies/pdfcraft-*-selkies-linux-aarch64.deb
          if-no-files-found: error
          retention-days: 14
