name: Build PDFCraft Selkies (ARM64)

on:
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "Also update the :latest convenience tag"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - pdfcraft-selkies
    paths:
      - ".github/workflows/pdfcraft-selkies.yml"
      - ".dockerignore"
      - "Dockerfile.selKies"
      - "selkies/**"
      - "packaging/linux/**"
      - "packaging/env.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "craft-i18n.rev"
      - "ATTRIBUTION.toml"

permissions:
  contents: read

concurrency:
  group: pdfcraft-selkies-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83
  NFPM_VERSION: 2.47.0
  NFPM_SHA256: 1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c

jobs:
  build-and-publish:
    name: Build PDFCraft .deb and Selkies image (ARM64)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout this fork and branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl jq git cmake clang \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libgtk-3-dev libvulkan-dev \
            libegl-dev libxkbcommon-x11-dev libxcursor-dev \
            libxinerama-dev libxfixes-dev libxrender-dev \
            qpdf poppler-utils
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install nfpm (pinned ARM64 binary and checksum)
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_arm64.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum --check -
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Install Rust 1.95 toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.95.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version
          "$HOME/.cargo/bin/cargo" --version

      - name: Cache Cargo build output
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Check out pinned craft-fonts input
        uses: actions/checkout@v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false

      - name: Read and validate craft-i18n pin
        id: i18n-pin
        shell: bash
        run: |
          set -euo pipefail
          test -f craft-i18n.rev
          REV="$(tr -d '[:space:]' < craft-i18n.rev)"
          [[ "$REV" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::craft-i18n.rev must contain one full 40-character commit SHA"
            exit 1
          }
          echo "rev=$REV" >> "$GITHUB_OUTPUT"

      - name: Check out craft-i18n at repository pin
        uses: actions/checkout@v7.0.1
        with:
          repository: storytold/craft-i18n
          ref: ${{ steps.i18n-pin.outputs.rev }}
          path: craft-i18n
          persist-credentials: false

      - name: Configure required embedded build inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >> "$GITHUB_ENV"
          echo "CRAFT_FONTS_REQUIRED=1" >> "$GITHUB_ENV"
          echo "CRAFT_I18N_DIR=$GITHUB_WORKSPACE/craft-i18n" >> "$GITHUB_ENV"
          echo "CRAFT_I18N_REQUIRED=1" >> "$GITHUB_ENV"
          echo "PDFCRAFT_BUILD_LABEL=selkies" >> "$GITHUB_ENV"
          echo "PDFCRAFT_BUILD_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "PDFCRAFT_BUILD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Verify locked workspace and required build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s Cargo.lock
          cargo metadata --locked --format-version 1 >/dev/null
          test -f "$CRAFT_FONTS_DIR/fonts/manifest.txt"
          test -f "$CRAFT_FONTS_DIR/fonts/simplified-chinese-manifest.txt"
          find "$CRAFT_I18N_DIR/locales" -name pdfcraft.tsv -print -quit | grep -q .
          echo "PDFCraft version: $(cargo xtask version)"
          echo "PDFCraft commit: $GITHUB_SHA"

      - name: Build and package native ARM64 desktop app
        shell: bash
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          CRAFT_I18N_DIR: ${{ github.workspace }}/craft-i18n
          CRAFT_I18N_REQUIRED: "1"
          PDFCRAFT_BUILD_LABEL: selkies
          PDFCRAFT_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The upstream packager builds pdfcraft + pdfcraft-cli and stages/checks
          # OCR models, model licences and attribution from ATTRIBUTION.toml.
          packaging/linux/package.sh --formats "deb"

          DEB="$(find dist/release -maxdepth 1 -type f \
            -name 'pdfcraft-*-selkies-linux-aarch64.deb' -print -quit)"
          test -n "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" \
            | grep -E '/usr/bin/pdfcraft$|/usr/share/pdfcraft/models/'
          mkdir -p dist/selkies
          cp "$DEB" dist/selkies/

      - name: Resolve immutable image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cargo xtask version | tr -d '[:space:]')"
          SHORT_SHA="${GITHUB_SHA::12}"
          OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/$OWNER/pdfcraft-selkies"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION-selkies-$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable ARM64 image (retry transient registry failures)
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -uo pipefail

          build_args=(
            --file Dockerfile.selKies
            --platform linux/arm64
            --provenance=mode=max
            --push
            --tag "${IMAGE}:${TAG}"
            --label "org.opencontainers.image.title=PDFCraft Selkies"
            --label "org.opencontainers.image.description=PDFCraft desktop streamed with LinuxServer Selkies"
            --label "org.opencontainers.image.source=https://github.com/${SOURCE_REPOSITORY}"
            --label "org.opencontainers.image.revision=${SOURCE_REVISION}"
            --label "org.opencontainers.image.version=${VERSION}-selkies"
            --progress=plain
            .
          )

          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            log_file="$RUNNER_TEMP/pdfcraft-build-attempt-${attempt}.log"
            echo "::group::Build attempt ${attempt}/${max_attempts}"
            set +e
            docker buildx build "${build_args[@]}" 2>&1 | tee "$log_file"
            build_status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            if [ "$build_status" -eq 0 ]; then
              echo "PDFCraft Selkies ARM64 image build and push succeeded on attempt ${attempt}."
              exit 0
            fi

            if ! grep -Eqi \
              '429 Too Many Requests|toomanyrequests|502 Bad Gateway|503 Service Unavailable|504 Gateway Timeout|TLS handshake timeout|i/o timeout|connection reset by peer|unexpected EOF|context deadline exceeded' \
              "$log_file"; then
              echo "::error::Docker build failed with a non-retryable error (exit ${build_status})."
              exit "$build_status"
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Docker build still failed after ${max_attempts} attempts due to transient registry/network errors."
              exit "$build_status"
            fi

            delay=$((15 * (2 ** (attempt - 1))))
            echo "::notice::Transient registry/network failure detected. Retrying in ${delay}s (attempt ${attempt}/${max_attempts})."
            sleep "$delay"
          done

      - name: Update :latest convenience tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_latest
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          IMMUTABLE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "$IMAGE:$IMMUTABLE_TAG"

      - name: Smoke-test published ARM64 image contents
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker pull --platform linux/arm64 "$IMAGE:$TAG"
          docker run --rm --platform linux/arm64 \
            --entrypoint /bin/bash "$IMAGE:$TAG" \
            -euo pipefail -c '
              echo "Checking Selkies desktop account..."
              id abc
              getent passwd abc >/dev/null

              echo "Checking PDFCraft executable..."
              test -x /usr/bin/pdfcraft

              echo "Checking OCR model assets and licence notices..."
              test -s /usr/share/pdfcraft/models/text-detection.onnx
              test -s /usr/share/pdfcraft/models/text-recognition.onnx
              test -s /usr/share/pdfcraft/models/ATTRIBUTION.txt
              test -s /usr/share/pdfcraft/models/text-detection.onnx.LICENCE.txt
              test -s /usr/share/pdfcraft/models/text-recognition.onnx.LICENCE.txt

              echo "Checking Selkies startup hooks..."
              test -x /defaults/autostart_wayland
              test -x /defaults/autostart

              echo "PDFCraft Selkies image content smoke test passed."
            '

      - name: Verify published image is ARM64
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$TAG"
          docker buildx imagetools inspect "$IMAGE:$TAG" --raw | jq -e '
            ((.architecture == "arm64" and .os == "linux") or
             ([.manifests[]? | select(
               .platform.os == "linux" and .platform.architecture == "arm64"
             )] | length > 0))
          '

      - name: Upload Debian package as workflow artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pdfcraft-selkies-deb-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}
          path: dist/selkies/pdfcraft-*-selkies-linux-aarch64.deb
          if-no-files-found: error
          retention-days: 14
